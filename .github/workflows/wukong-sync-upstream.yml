name: Sync upstream CLIProxyAPI

# 定时轮询上游 router-for-me/CLIProxyAPI 的最新 release，把上游新 tag merge 进本仓库，
# go.mod 冲突自动用「取上游版 + go mod tidy」收口，编译 + 测试通过就开 PR 供审核；
# 遇到非 go.mod 冲突或编译/测试失败则开 issue 让人处理。
#
# 为什么用 merge 而非 rebase：本仓库 = 上游 + 我们的补丁。用 merge 把上游 tag 并进来，
# 上游 tag 会成为 main 的祖先，下一次同步的 merge-base 自然是上一版，链路可持续；PR 也能
# 直接点“合并”按钮落地。**务必用 “Create a merge commit” 合并 PR，不要 squash**——squash 会
# 丢掉上游 tag 的祖先关系，导致下次 merge 把上游改动重放而冲突。仓库已设为仅允许 merge commit。
#
# 一次性前提（仓库 Settings → Actions → General → Workflow permissions）：
#   勾选 “Allow GitHub Actions to create and approve pull requests”，否则开 PR 会 403。
#
# 关于 .github/workflows/：GitHub 不允许默认的 GITHUB_TOKEN 推送任何改动了工作流文件的分支
# （“refusing to allow a GitHub App to create or update workflow … without `workflows` permission”）。
# 上游偶尔会改自己的 release.yaml 等文件，同步分支带上就推不上去。这里按是否配置了 secret
# SYNC_PAT 走两条路：
#   - 有 SYNC_PAT（fine-grained PAT，仓库限定，Contents / Pull requests / Issues / Workflows 读写）：
#     用它 checkout 与推送，上游工作流改动照常同步进来；
#   - 没有：合并后把 .github/workflows/ 恢复成 main 的版本再推（冲突也按此处理），
#     上游那几份工作流在本 fork 里本来就不会触发（只在推 tag / 非 bot 开 PR 时运行），停在旧版无碍。

on:
  schedule:
    - cron: "17 6 * * *" # 每天 06:17 UTC 轮询
  workflow_dispatch: {} # 也可在 Actions 页手动触发

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM: router-for-me/CLIProxyAPI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（全量历史 + tags）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # 有 SYNC_PAT 就用它，后续 git push 才有 workflows 权限；没有则退回默认令牌。
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Go（版本跟随 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve versions
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          base=$(cat .upstream-base 2>/dev/null | tr -d '[:space:]' || true)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "base=$base"     >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$base" ]; then
            echo "up_to_date=true"  >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base latest=$latest"

      - name: Up to date
        if: steps.v.outputs.up_to_date == 'true'
        run: echo "已是最新（base=${{ steps.v.outputs.base }}），无需同步。"

      - name: Merge upstream tag
        if: steps.v.outputs.up_to_date == 'false'
        id: merge
        env:
          NEW: ${{ steps.v.outputs.latest }}
          # 'true' / 'false'：有没有配置 SYNC_PAT。没有就不能把工作流文件的改动推上去。
          HAS_PAT: ${{ secrets.SYNC_PAT != '' }}
        run: |
          set -uo pipefail
          git config user.name  "wukong-sync-bot"
          git config user.email "wukong-sync-bot@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --tags --no-recurse-submodules upstream

          branch="sync/${NEW}"
          git checkout -B "$branch" main

          # 把上游新 tag merge 进来
          if ! git merge --no-edit "$NEW"; then
            # 自动解冲突：
            #   - go.mod / go.sum：取上游版 + go mod tidy；
            #   - .github/workflows/*（仅在没有 SYNC_PAT 时）：取 main 的版本，反正推不上去；
            #   - 其它文件：放弃，开 issue 让人处理。
            unmerged=$(git diff --name-only --diff-filter=U | sort -u)
            gomod=$(printf '%s\n' "$unmerged" | grep -E '^(go\.mod|go\.sum)$' || true)
            workflows=""
            others=$(printf '%s\n' "$unmerged" | grep -vE '^(go\.mod|go\.sum)$' || true)
            if [ "$HAS_PAT" != "true" ]; then
              workflows=$(printf '%s\n' "$unmerged" | grep -E '^\.github/workflows/' || true)
              others=$(printf '%s\n' "$others" | grep -vE '^\.github/workflows/' || true)
            fi
            others=$(printf '%s\n' "$others" | sed '/^$/d')
            if [ -n "$unmerged" ] && [ -z "$others" ]; then
              if [ -n "$gomod" ]; then
                git checkout "$NEW" -- go.mod go.sum
                go mod tidy
                git add go.mod go.sum
              fi
              if [ -n "$workflows" ]; then
                # 冲突的工作流文件：main 里有的取 main 版，main 里没有的（上游新增）删掉。
                printf '%s\n' "$workflows" | while IFS= read -r f; do
                  [ -z "$f" ] && continue
                  if git cat-file -e "main:$f" 2>/dev/null; then
                    git checkout main -- "$f"
                  else
                    git rm -q -f -- "$f"
                  fi
                done
              fi
              git commit --no-edit
            else
              {
                echo "status=conflict"
                echo "conflict<<EOF"
                printf '%s\n' "$unmerged"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              git merge --abort || true
              exit 0
            fi
          fi

          # 没有 SYNC_PAT：把 .github/workflows/ 整体恢复成 main 的版本（含删掉上游新增的文件），
          # 否则默认令牌推不上去。有 SYNC_PAT 时保留上游改动。
          if [ "$HAS_PAT" != "true" ]; then
            git rm -r -q --cached .github/workflows
            rm -rf .github/workflows
            git checkout main -- .github/workflows
            git add -A .github/workflows
            if ! git diff --cached --quiet; then
              git commit -m "chore: keep fork workflows unchanged (no workflows permission for GITHUB_TOKEN)"
              echo "上游改了 .github/workflows/，未配置 SYNC_PAT，已恢复为 main 的版本。"
            fi
          fi

          # 更新基线标记（下次同步据此比较）
          printf '%s\n' "$NEW" > .upstream-base
          git add .upstream-base
          git commit -m "chore: sync upstream base to ${NEW}"
          echo "status=merged" >> "$GITHUB_OUTPUT"
          echo "branch=$branch"  >> "$GITHUB_OUTPUT"

      - name: Build & test
        if: steps.merge.outputs.status == 'merged'
        id: verify
        run: |
          set -uo pipefail
          if go build ./... && go test ./wukong/...; then
            echo "status=green" >> "$GITHUB_OUTPUT"
          else
            echo "status=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch & open PR（绿）
        if: steps.verify.outputs.status == 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NEW: ${{ steps.v.outputs.latest }}
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          set -euo pipefail
          git push -f origin "$BRANCH"
          # 必须显式 -R 指定本仓库：CI 里同时有 origin 与 upstream 两个 remote，
          # 不指定会被解析到 upstream(router-for-me)，对其无权创建 PR。
          gh pr create -R "$REPO" --base main --head "$BRANCH" \
            --title "Sync to upstream ${NEW}" \
            --body "自动把上游 \`${NEW}\` merge 进来；go.mod 已用「取上游版 + go mod tidy」收口；\`go build ./...\` 与 \`go test ./wukong/...\` 均通过。**请用 “Create a merge commit” 合并，勿 squash**（仓库已限制为仅 merge commit）。" \
            || echo "PR 可能已存在（分支已强推更新）。"

      - name: Open issue（冲突或红）
        if: steps.merge.outputs.status == 'conflict' || steps.verify.outputs.status == 'red'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NEW: ${{ steps.v.outputs.latest }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
        run: |
          set -euo pipefail
          gh issue create -R "$REPO" \
            --title "需人工同步到上游 ${NEW}" \
            --body $'自动同步失败，需人工处理。\n\n可能原因：\n- `sdk/cliproxy/service_executors.go` / `service_models.go` 的钩子行与上游改动冲突（非 go.mod，无法自动解）；\n- 上游 API 变更导致 `go build` / `go test ./wukong/...` 失败。\n\n冲突文件（若有）：\n```\n'"${CONFLICT:-见 Actions 日志}"$'\n```\n详情见本次 Actions 运行日志。'
